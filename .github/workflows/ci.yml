name: CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint & test & build
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: symios
          MYSQL_USER: ci
          MYSQL_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    # DATABASE_URL pointe vers le service MySQL ; les autres valeurs
    # permettent à svelte-kit sync de générer $env/static/private.
    env:
      DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/symios
      STRIPE_PRIVATE_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init database schema
        run: |
          # db/init n'est pas bind-mounté dans le service MySQL : le conteneur
          # laisserait des fichiers root-owner dans le workspace et ferait
          # échouer le checkout du run suivant (EACCES rmdir). On applique le
          # schéma ici via un conteneur jetable (montage en lecture seule sur
          # /tmp, stdin pour le SQL) : aucun fichier ne reste dans le workspace.
          for f in db/init/*.sql; do
            docker run --rm --network host -i \
              -e MYSQL_PWD=root \
              mysql:8 mysql -h 127.0.0.1 -uroot symios < "$f"
          done

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Svelte check
        run: npm run check

      - name: Unit + integration tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy (Infomaniak)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy via SSH (placeholder — à personnaliser pour Infomaniak)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.INFOMANIAK_HOST }}
          username: ${{ secrets.INFOMANIAK_USER }}
          key: ${{ secrets.INFOMANIAK_SSH_KEY }}
          port: ${{ secrets.INFOMANIAK_PORT }}
          script: |
            set -e
            echo "Déploiement Symios vers l'hébergement Infomaniak (Node.js)."
            echo "Placeholder — adaptez le chemin et la procédure à votre serveur."
            # Exemple :
            # rsync -az --delete --exclude node_modules ./build/ user@host:/srv/symios/build/
            # cd /srv/symios && npm ci --omit=dev && pm2 restart symios || true