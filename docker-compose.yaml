services:
  mysql:
    image: mysql:8
    container_name: symios-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: symios
      MYSQL_USER: symios
      MYSQL_PASSWORD: symios
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - ./db/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - proxy

  app:
    build:
      context: .
      args:
        BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
    container_name: symios-app
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - proxy

volumes:
  mysql-data:

networks:
  proxy:
    external: true